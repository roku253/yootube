<head>

  <link rel="stylesheet" href="../css/watch-shell.css" />
  <script>window.__TOKEN_RESOURCE_KEY__ = "ext:yootube"</script>
  <script src="../token-gate.js" defer></script>
</head>
<body>
  
    <main class="watch-shell" style="max-width:960px;margin:0 auto;padding:24px 16px;font-family:Roboto,Arial,sans-serif">
      <h1 style="font-size:20px;margin:0 0 8px">【2016】霞ノ杜 児童行方不明事件 続報（ローカル）</h1>
      <p style="color:#606060;font-size:13px;margin:0 0 16px">霞ノ杜テレビ / 2016年8月14日</p>
      <div style="aspect-ratio:16/9;background:#111;color:#eee;display:flex;align-items:center;justify-content:center;font-size:14px">
        [ 報道映像プレースホルダ ]
      
      <p style="line-height:1.7;font-size:14px;margin-top:16px">
        ナレーション: 行方不明から保護された三人の児童について、町は詳細を公表していない。
        一方、現場付近で撮影された別角度の映像には、当時20歳だった<strong>大倉翔太</strong>氏の姿が写っているとする情報が、ネット上に残っている。

      <p><a href="../">← Yootube トップ</a></p>
    </main>
  
  <script>
    (function () {
      var KN_FP_KEY = "signal_trace_kn_footprint_v2";
      function knApply() {
        try {
          var f = localStorage.getItem(KN_FP_KEY) || "";
          if (f === "purged_delete" || f === "purged_keep") {
            document.getElementById("site-root").style.display = "none";
          }
        } catch (e) {}
      }
      window.addEventListener("storage", function (e) {
        if (e.key === KN_FP_KEY) knApply();
      });
      var poll = setInterval(function () {
        if (document.documentElement.classList.contains("token-gate-ok")) {
          clearInterval(poll);
          document.getElementById("site-root").style.visibility = "visible";
          knApply();
        }
      }, 50);
    })();
  </script>
</body>
