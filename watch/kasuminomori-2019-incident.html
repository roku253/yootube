<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet" href="../css/watch-shell.css" />
  <script>window.__TOKEN_RESOURCE_KEY__ = "ext:yootube:kasuminomori-pr"</script>
  <script src="../token-gate.js" defer></script>
</head>
<body>
  <div id="site-root" style="visibility:hidden">
    <main class="watch-shell">
      <div class="watch-player" aria-label="報道映像">
        <span class="watch-player-label">[ 報道映像 ]</span>
      </div>
      <h1 class="watch-title">【2019】霞ノ杜 登山事故・児童保護 報道</h1>
      <p class="watch-meta">霞ノ杜テレビ / 2019年8月14日</p>
      <div class="watch-chapters" aria-label="チャプター">
        <button type="button" class="is-active">0:00 オープニング</button>
        <button type="button">0:42 現場付近の別角度</button>
        <button type="button">1:15 町のコメント</button>
      </div>
      <p class="watch-desc">
        山道付近での負傷・保護について、町は詳細を公表していない。
        映像はモザイク処理され、氏名・個人の特定はできない編集となっている。
        怪奇・失踪説とは別件として編集されている。
      </p>
      <p class="watch-caption">字幕（0:42）: …登山事故…児童保護…</p>
      <section class="watch-comments" data-kn-story-clue="1" aria-label="コメント">
        <h2 class="watch-comments-title">コメント</h2>
        <p class="watch-comment"><strong>aosora_0412</strong> — 見たくないのに見ちゃう。なんでだろ</p>

      </section>
      <p><a href="../">← Yootube トップ</a></p>
    </main>
  </div>
  <script>
    (function () {
      var KN_FP_KEY = "signal_trace_kn_footprint_v2";
      function knApply() {
        try {
          var f = localStorage.getItem(KN_FP_KEY) || "";
          if (f === "purged_delete" || f === "purged_keep" || f === "purged_partial") {
            document.getElementById("site-root").style.display = "none";
          }
        } catch (e) {}
      }
      window.addEventListener("storage", function (e) {
        if (e.key === KN_FP_KEY) knApply();
      });
      var poll = setInterval(function () {
        if (document.documentElement.classList.contains("token-gate-ok")) {
          clearInterval(poll);
          document.getElementById("site-root").style.visibility = "visible";
          knApply();
        }
      }, 50);
    })();
  </script>
</body>
</html>
