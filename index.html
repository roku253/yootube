<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Yootube</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      color-scheme: light dark;
      --accent: #ff0000;
      --masthead-h: 56px;
      --bg: #ffffff;
      --bg-elevated: #f9f9f9;
      --border: rgba(0, 0, 0, 0.1);
      --text: #0f0f0f;
      --text-secondary: #606060;
      --chip-active-bg: #0f0f0f;
      --chip-active-text: #ffffff;
      --chip-bg: rgba(0, 0, 0, 0.05);
      --chip-hover: rgba(0, 0, 0, 0.1);
      --hover: rgba(0, 0, 0, 0.05);
      --search-inner-bg: #ffffff;
      --search-btn-bg: #f8f8f8;
      --sb-active-bg: rgba(0, 0, 0, 0.08);
      --pill-ghost-bg: rgba(0, 0, 0, 0.06);
      --pill-ghost-hover: rgba(0, 0, 0, 0.1);
      --thumb-bg: #e8e8e8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f0f0f;
        --bg-elevated: #212121;
        --border: rgba(255, 255, 255, 0.1);
        --text: #f1f1f1;
        --text-secondary: #aaa;
        --chip-active-bg: #f1f1f1;
        --chip-active-text: #0f0f0f;
        --chip-bg: rgba(255, 255, 255, 0.1);
        --chip-hover: rgba(255, 255, 255, 0.18);
        --hover: rgba(255, 255, 255, 0.08);
        --search-inner-bg: #121212;
        --search-btn-bg: rgba(255, 255, 255, 0.08);
        --sb-active-bg: rgba(255, 255, 255, 0.15);
        --pill-ghost-bg: rgba(255, 255, 255, 0.1);
        --pill-ghost-hover: rgba(255, 255, 255, 0.16);
        --thumb-bg: #181818;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: "Roboto", "Yu Gothic UI", "Yu Gothic", Meiryo, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
    }
    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: transparent;
      color: inherit;
      padding: 0;
    }
    a { color: inherit; text-decoration: none; }

    #site-root { visibility: hidden; min-height: 100%; }
    html.token-gate-ok #site-root { visibility: visible; }

    /* —— Masthead —— */
    .masthead {
      position: sticky;
      top: 0;
      z-index: 100;
      height: var(--masthead-h);
      padding: 0 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }
    .masthead-start {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }
    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
    }
    .icon-btn:hover { background: var(--hover); }
    .icon-btn svg { width: 24px; height: 24px; display: block; }

    .brand {
      display: flex;
      align-items: center;
      gap: 2px;
      font-weight: 700;
      font-size: 20px;
      letter-spacing: -0.5px;
      color: var(--text);
    }
    .brand-mark {
      width: 90px;
      height: 20px;
      display: block;
    }

    .masthead-center {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      max-width: 720px;
      margin: 0 auto;
      gap: 8px;
      min-width: 0;
    }
    .search-wrap {
      flex: 1;
      display: flex;
      align-items: stretch;
      max-width: 560px;
      min-width: 0;
      border: 1px solid var(--border);
      border-radius: 40px;
      overflow: hidden;
      background: var(--search-inner-bg);
    }
    .search-wrap:focus-within {
      border-color: #1c62b9;
      box-shadow: inset 0 0 0 1px #1c62b9;
    }
    .search-wrap input {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 16px;
      padding: 0 16px;
      min-width: 0;
      outline: none;
    }
    .search-wrap input::placeholder { color: #888; }
    .search-submit {
      width: 64px;
      flex-shrink: 0;
      background: var(--search-btn-bg);
      border-left: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
    }
    .search-submit:hover { background: var(--hover); }
    .search-submit svg { width: 24px; height: 24px; }

    .masthead-end {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      margin-left: auto;
    }
    .pill-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 0 12px;
      height: 36px;
      border-radius: 18px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
    }
    .pill-btn:hover { background: var(--hover); }
    .pill-btn svg { width: 24px; height: 24px; }

    .notif-wrap {
      position: relative;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .notif-wrap:hover { background: var(--hover); }
    .notif-badge {
      position: absolute;
      top: 6px;
      right: 4px;
      min-width: 16px;
      height: 14px;
      padding: 0 4px;
      font-size: 10px;
      font-weight: 500;
      line-height: 14px;
      text-align: center;
      background: var(--accent);
      color: #fff;
      border-radius: 999px;
    }

    .avatar-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, #065fd4, #3ea6ff);
      color: #fff;
      font-size: 13px;
      font-weight: 500;
      margin-left: 4px;
    }

    /* —— Body: ガイドはドロワー（ハンバーガーで開閉） —— */
    .app-body {
      display: block;
      min-height: calc(100vh - var(--masthead-h));
      position: relative;
    }

    .guide-scrim {
      position: fixed;
      left: 0;
      right: 0;
      top: var(--masthead-h);
      bottom: 0;
      z-index: 150;
      background: rgba(0, 0, 0, 0.5);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s ease, visibility 0.2s ease;
      cursor: pointer;
      border: none;
      padding: 0;
      display: block;
    }
    html.guide-open .guide-scrim {
      opacity: 1;
      visibility: visible;
    }

    /* Sidebar drawer */
    .sidebar {
      --sidebar-w-drawer: 240px;
      position: fixed;
      left: 0;
      top: var(--masthead-h);
      bottom: 0;
      width: var(--sidebar-w-drawer);
      max-width: min(var(--sidebar-w-drawer), 92vw);
      flex-shrink: 0;
      padding: 12px 12px 24px;
      overflow-y: auto;
      overflow-x: hidden;
      background: var(--bg);
      border-right: 1px solid var(--border);
      z-index: 200;
      transform: translateX(-100%);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: none;
    }
    html.guide-open .sidebar {
      transform: translateX(0);
      box-shadow: 4px 0 24px rgba(0, 0, 0, 0.18);
    }

    html.guide-open,
    html.guide-open body {
      overflow: hidden;
    }
    .sb-item {
      display: flex;
      align-items: center;
      gap: 24px;
      height: 40px;
      padding: 0 12px;
      border-radius: 10px;
      font-size: 14px;
      color: var(--text);
    }
    .sb-item:hover { background: var(--hover); }
    .sb-item.is-active {
      background: var(--sb-active-bg);
      font-weight: 500;
    }
    .sb-item svg { width: 24px; height: 24px; flex-shrink: 0; opacity: 0.95; }

    .sb-rule {
      height: 1px;
      background: var(--border);
      margin: 12px 0;
    }

    .sb-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px 8px 24px;
      font-size: 16px;
      font-weight: 500;
      color: var(--text);
    }
    .sb-heading svg { width: 16px; height: 16px; opacity: 0.7; }

    .sb-sub {
      display: flex;
      align-items: center;
      gap: 24px;
      height: 40px;
      padding: 0 12px 0 12px;
      border-radius: 10px;
      font-size: 14px;
      color: var(--text);
    }
    .sb-sub:hover { background: var(--hover); }
    .sb-av {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      flex-shrink: 0;
      background: var(--chip-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--text);
    }
    .sb-sub .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      margin-left: auto;
      flex-shrink: 0;
    }
    .sb-sub .new-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #3ea6ff;
      margin-left: auto;
      flex-shrink: 0;
    }
    .sb-more {
      padding: 8px 24px;
      font-size: 14px;
      color: var(--text);
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      gap: 24px;
      margin-top: 4px;
    }
    .sb-more:hover { background: var(--hover); }
    .sb-more svg:first-child { width: 24px; height: 24px; opacity: 0.85; }

    /* Main column */
    .main-col {
      width: 100%;
      min-width: 0;
      padding: 0 24px 32px;
      box-sizing: border-box;
    }

    /* Chip strip */
    .chips {
      position: sticky;
      top: var(--masthead-h);
      z-index: 90;
      display: flex;
      gap: 12px;
      padding: 12px 0 12px 8px;
      background: var(--bg);
      border-bottom: 1px solid transparent;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      flex-shrink: 0;
      padding: 0 12px;
      height: 32px;
      line-height: 32px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      background: var(--chip-bg);
      color: var(--text);
      border: none;
      cursor: pointer;
    }
    .chip:hover { background: var(--chip-hover); }
    .chip.is-on {
      background: var(--chip-active-bg);
      color: var(--chip-active-text);
    }

    /* Feed */
    .feed {
      padding-top: 8px;
      padding-left: 8px;
    }
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr));
      column-gap: 16px;
      row-gap: 40px;
    }

    .featured {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr);
      gap: 24px;
      align-items: stretch;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 8px;
    }
    @media (max-width: 900px) {
      .featured { grid-template-columns: 1fr; }
    }
    .featured-thumb {
      position: relative;
      aspect-ratio: 16 / 9;
      border-radius: 12px;
      overflow: hidden;
      background: var(--thumb-bg);
    }
    .featured-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .featured-body { display: flex; flex-direction: column; justify-content: center; gap: 12px; min-width: 0; }
    .featured-kicker { font-size: 12px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.04em; }
    .featured-title { font-size: 28px; font-weight: 700; line-height: 1.2; letter-spacing: -0.02em; }
    .featured-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; }
    .btn-solid {
      height: 36px;
      padding: 0 16px;
      border-radius: 18px;
      background: var(--text);
      color: var(--bg);
      font-weight: 500;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .btn-solid:hover { opacity: 0.92; }
    .btn-ghost {
      height: 36px;
      padding: 0 16px;
      border-radius: 18px;
      background: var(--pill-ghost-bg);
      color: var(--text);
      font-weight: 500;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .btn-ghost:hover { background: var(--pill-ghost-hover); }

    .video-card {
      display: block;
      cursor: pointer;
      border-radius: 12px;
      margin: -4px;
      padding: 4px;
    }
    .video-card:hover .video-title { color: var(--text); }
    .video-card:focus-visible {
      outline: 2px solid #3ea6ff;
      outline-offset: 2px;
    }

    .thumb {
      position: relative;
      aspect-ratio: 16 / 9;
      background: var(--thumb-bg);
      border-radius: 12px;
      overflow: hidden;
    }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .duration {
      position: absolute;
      right: 8px;
      bottom: 8px;
      padding: 2px 6px;
      font-size: 12px;
      font-weight: 500;
      line-height: 1.4;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
    }

    .meta-row {
      display: flex;
      gap: 12px;
      margin-top: 12px;
      align-items: flex-start;
    }
    .ch-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      flex-shrink: 0;
      background: linear-gradient(145deg, #444, #222);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 600;
      color: #eee;
    }
    .meta-text { flex: 1; min-width: 0; padding-right: 4px; }
    .video-title {
      font-size: 16px;
      font-weight: 500;
      line-height: 1.35;
      color: var(--text);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin: 0;
    }
    .ch-line {
      margin-top: 4px;
      font-size: 14px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: wrap;
    }
    .ch-line .verify {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
      opacity: 0.85;
    }
    .stat-line {
      margin-top: 2px;
      font-size: 14px;
      color: var(--text-secondary);
    }
    .meta-menu {
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      margin: -8px -8px 0 0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      opacity: 0;
      pointer-events: none;
      user-select: none;
    }
    .video-card:hover .meta-menu,
    .video-card:focus-within .meta-menu {
      opacity: 1;
    }
    .meta-menu svg { width: 24px; height: 24px; }

    @media (max-width: 900px) {
      .featured { grid-column: 1 / -1; }
      .masthead-center { display: none; }
      .meta-menu { opacity: 1; }
    }
    @media (max-width: 656px) {
      .main-col { padding-right: 16px; padding-left: 16px; }
    }

    /* Denied overlay — dark */
    .ns-denied-overlay {
      position: fixed;
      inset: 0;
      z-index: 999999;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Roboto", system-ui, sans-serif;
      padding: 24px;
    }
    .ns-denied-card {
      max-width: 520px;
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--bg-elevated);
      padding: 26px 22px;
      text-align: center;
    }
    .ns-denied-card h1 { margin: 0 0 10px; color: var(--accent); font-size: 18px; font-weight: 500; }
    .ns-denied-card p { margin: 6px 0; font-size: 14px; color: var(--text-secondary); line-height: 1.7; }
    .ns-denied-card .small { font-size: 12px; color: var(--text-secondary); margin-top: 14px; opacity: 0.85; }
  </style>
  <script>window.__TOKEN_RESOURCE_KEY__ = "ext:yootube:kasuminomori-pr"</script>
  <script>
    window.__TOKEN_DENIED__ = function (msg) {
      var el = document.createElement("div");
      el.className = "ns-denied-overlay";
      el.innerHTML =
        '<div class="ns-denied-card">' +
        '<h1>Yootube ｜ 403 — 限定公開</h1>' +
        '<p>このページは現在、限定公開モードで配信されています。</p>' +
        '<p>正規の経路（プレイ画面）からアクセスしてください。</p>' +
        '<p class="small">' + String(msg || "").replace(/[<>]/g, "") + '</p>' +
        '</div>';
      document.documentElement.appendChild(el);
    };
  </script>
  <script src="./token-gate.js" defer></script>
</head>
<body>
  <div id="site-root">
    <header class="masthead" role="banner">
      <div class="masthead-start">
        <button type="button" class="icon-btn" id="guideToggle" aria-expanded="false" aria-controls="guideDrawer" aria-label="ガイドを開く">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 6H3V5h18v1zm0 5H3v1h18v-1zm0 6H3v1h18v-1z"/></svg>
        </button>
        <a class="brand" href="./" aria-label="Yootube ホーム">
          <svg class="brand-mark" viewBox="0 0 90 20" aria-hidden="true">
            <path fill="#FF0033" d="M28 4.2c0-1.6 1.3-3 3-3h8.4c1.7 0 3 1.4 3 3v11.6c0 1.6-1.3 3-3 3H31c-1.7 0-3-1.4-3-3V4.2zm5.3 2.4v7l5.6-3.5-5.6-3.5z"/>
            <text x="46" y="15" fill="currentColor" font-size="15" font-family="Roboto, sans-serif" font-weight="700">Yootube</text>
          </svg>
        </a>
      </div>
      <div class="masthead-center">
        <form class="search-wrap" role="search" aria-label="Yootube で検索" onsubmit="return false;">
          <input type="search" name="q" placeholder="検索" autocomplete="off" />
          <button type="submit" class="search-submit" aria-label="検索を実行">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          </button>
        </form>
        <button type="button" class="icon-btn mic" aria-label="音声で検索">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15c-.08-.49-.49-.85-.98-.85-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.1-.6-.39-1.14-1-1.14z"/></svg>
        </button>
      </div>
      <div class="masthead-end">
        <button type="button" class="pill-btn" aria-label="作成">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 13v5h-4v-5H5v-4h5V4h4v5h5v4h-5zm-1-11h-2v6H5v2h6v6h2v-6h6v-2h-6V2z"/></svg>
          <span>作成</span>
        </button>
        <button type="button" class="notif-wrap" aria-label="通知">
          <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
          <span class="notif-badge">9+</span>
        </button>
        <button type="button" class="avatar-btn" aria-label="アカウント">ロ</button>
      </div>
    </header>

    <div class="app-body">
      <button type="button" class="guide-scrim" id="guideScrim" tabindex="-1" aria-label="メニューを閉じる"></button>
      <aside class="sidebar" id="guideDrawer" aria-label="ガイド">
        <a class="sb-item is-active" href="./">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
          <span class="sb-label">ホーム</span>
